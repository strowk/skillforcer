<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t">
  <title id="t">skillforcer decision loop: a PreToolUse guard denies governed writes until the required skill has been loaded recently; skill loads are captured by a PostToolUse recorder hook into session state, which the guard reads, so the retried write is allowed</title>
  <defs>
    <marker id="m-mut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781"/>
    </marker>
    <marker id="m-good" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ca30c"/>
    </marker>
    <marker id="m-crit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d03b3b"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/>
    </marker>
  </defs>

  <!-- ═══ flow arrows ═══ -->
  <line x1="264" y1="74" x2="350" y2="74" stroke="#898781" stroke-width="1.6" marker-end="url(#m-mut)"/>
  <line x1="614" y1="74" x2="690" y2="74" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#m-good)"/>
  <text x="652" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#0ca30c">&#10003; fresh</text>

  <line x1="560" y1="116" x2="560" y2="350" stroke="#d03b3b" stroke-width="1.6" marker-end="url(#m-crit)"/>
  <text x="572" y="228" font-size="12" font-weight="600" fill="#d03b3b">&#10005; stale</text>
  <text x="572" y="244" font-size="11" fill="#c3c2b7">or never loaded</text>

  <line x1="352" y1="396" x2="270" y2="396" stroke="#898781" stroke-width="1.6" marker-end="url(#m-mut)"/>

  <line x1="150" y1="354" x2="150" y2="122" stroke="#898781" stroke-width="1.6" marker-end="url(#m-mut)"/>
  <circle cx="170" cy="228" r="9" fill="#d95926"/>
  <text x="170" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="185" y="232" font-size="12" font-weight="600" fill="#ffffff">retry</text>
  <text x="162" y="250" font-size="11" fill="#c3c2b7">skill now fresh</text>

  <!-- ═══ recording spine (dashed): Skill load ⇢ recorder ⇢ state ⇢ guard ═══ -->
  <line x1="240" y1="352" x2="296" y2="334" stroke="#3987e5" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#m-blue)"/>
  <text x="312" y="348" font-size="10.5" fill="#c3c2b7">fires on every Skill load</text>

  <line x1="390" y1="254" x2="390" y2="232" stroke="#3987e5" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#m-blue)"/>
  <text x="402" y="246" font-size="10.5" fill="#c3c2b7">logs the load</text>

  <line x1="390" y1="138" x2="390" y2="118" stroke="#3987e5" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#m-blue)"/>
  <text x="402" y="136" font-size="10.5" fill="#c3c2b7">guard reads freshness</text>

  <!-- ═══ ① Write / Edit ═══ -->
  <rect x="40" y="36" width="220" height="76" rx="10" fill="#1a1a19" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <circle cx="234" cy="62" r="12" fill="#d95926"/>
  <text x="234" y="66.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="56" y="58" font-size="9" letter-spacing="0.5" fill="#898781">CLAUDE</text>
  <text x="56" y="79" font-size="15" font-weight="600" fill="#ffffff">Write / Edit</text>
  <text x="56" y="98" font-size="12" fill="#c3c2b7">a file a rule governs</text>

  <!-- ═══ ② Freshness guard ═══ -->
  <rect x="360" y="36" width="250" height="76" rx="10" fill="#1a1a19" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <circle cx="584" cy="62" r="12" fill="#3987e5"/>
  <text x="584" y="66.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="376" y="58" font-size="9" letter-spacing="0.5" fill="#898781">SKILLFORCER &#183; HOOK (PreToolUse)</text>
  <text x="376" y="79" font-size="15" font-weight="600" fill="#ffffff">Freshness guard</text>
  <text x="376" y="98" font-size="12" fill="#c3c2b7">required skill loaded recently?</text>

  <!-- ═══ ✓ allowed ═══ -->
  <rect x="700" y="36" width="200" height="76" rx="10" fill="#0ca30c" fill-opacity="0.12" stroke="#0ca30c" stroke-opacity="0.55" stroke-width="1"/>
  <text x="716" y="58" font-size="9" letter-spacing="0.5" fill="#898781">OUTCOME</text>
  <text x="716" y="79" font-size="15" font-weight="600" fill="#ffffff"><tspan fill="#0ca30c">&#10003;</tspan> Write allowed</text>
  <text x="716" y="98" font-size="12" fill="#c3c2b7">guidance is in context</text>

  <!-- ═══ session state ═══ -->
  <rect x="280" y="142" width="220" height="84" rx="10" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-opacity="0.5" stroke-width="1"/>
  <text x="296" y="162" font-size="9" letter-spacing="0.5" fill="#898781">SKILLFORCER &#183; STATE</text>
  <text x="296" y="183" font-size="14" font-weight="600" fill="#ffffff">Session state</text>
  <text x="296" y="200" font-size="11.5" fill="#c3c2b7">skill loads &#183; transcript cursor</text>
  <text x="296" y="216" font-size="10" fill="#898781">session &#183; minutes &#183; turns &#183; tokens</text>

  <!-- ═══ load recorder ═══ -->
  <rect x="280" y="258" width="220" height="72" rx="10" fill="#1a1a19" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="296" y="279" font-size="9" letter-spacing="0.5" fill="#898781">SKILLFORCER &#183; HOOK (PostToolUse)</text>
  <text x="296" y="300" font-size="14" font-weight="600" fill="#ffffff">Load recorder</text>
  <text x="296" y="318" font-size="11.5" fill="#c3c2b7">sees every Skill tool call</text>

  <!-- ═══ ③ denied ═══ -->
  <rect x="360" y="358" width="250" height="76" rx="10" fill="#d03b3b" fill-opacity="0.12" stroke="#d03b3b" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="584" cy="384" r="12" fill="#3987e5"/>
  <text x="584" y="388.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="376" y="380" font-size="9" letter-spacing="0.5" fill="#898781">OUTCOME</text>
  <text x="376" y="401" font-size="15" font-weight="600" fill="#ffffff"><tspan fill="#d03b3b">&#10005;</tspan> Denied, with reason</text>
  <text x="376" y="420" font-size="12" font-style="italic" fill="#c3c2b7">&#8220;load tech-writing first&#8230;&#8221;</text>

  <!-- ═══ ④ Skill tool ═══ -->
  <rect x="40" y="358" width="220" height="76" rx="10" fill="#1a1a19" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <circle cx="234" cy="384" r="12" fill="#d95926"/>
  <text x="234" y="388.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="56" y="380" font-size="9" letter-spacing="0.5" fill="#898781">CLAUDE</text>
  <text x="56" y="401" font-size="15" font-weight="600" fill="#ffffff">Runs the Skill tool</text>
  <text x="56" y="420" font-size="12" fill="#c3c2b7">reads reason, loads the skill</text>
</svg>
